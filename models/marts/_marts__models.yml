version: 2

models:
  - name: fct_orders
    description: >
      Факт заказов: одна строка — один заказ. Тестовые заказы исключены.
      Отвечает на вопросы про заказы и деньги: выручка, средний чек, оплаты и возвраты.
      Выручка — сумма order_amount по строкам с is_confirmed = true.
    columns:
      - name: order_id
        description: "Номер заказа, первичный ключ."
        data_tests: [unique, not_null]
      - name: customer_id
        description: "Клиент, оформивший заказ. Ссылка на dim_customers."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: "Дата заказа. Ссылка на dim_dates."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day
      - name: ordered_at
        description: "Время оформления заказа."
      - name: order_status
        description: "Статус заказа: paid, pending, returned, cancelled. Статуса test в витрине быть не должно."
        data_tests:
          - accepted_values:
              arguments:
                values: ['paid', 'pending', 'returned', 'cancelled']
      - name: order_amount
        description: "Сумма заказа в рублях после скидок."
        data_tests: [not_null, non_negative]
      - name: items_count
        description: "Число разных товаров в заказе."
        data_tests: [not_null, non_negative]
      - name: paid_amount
        description: "Сумма успешных оплат без возвратов; 0, если оплат нет."
        data_tests: [non_negative]
      - name: refunded_amount
        description: "Сумма возвратов положительным числом; 0, если возвратов нет."
        data_tests: [non_negative]
      - name: net_paid_amount
        description: "Оплачено минус возвращено."
      - name: successful_payments_count
        description: "Число успешных оплат без возвратов."
      - name: first_paid_at
        description: "Время первой успешной оплаты; пусто, если оплат нет."
      - name: is_confirmed
        description: '{{ doc("confirmed_order") }}'
        data_tests: [not_null]

  - name: fct_order_items
    description: >
      Факт позиций заказа: одна строка — один товар в заказе. Тестовые заказы исключены.
      Отвечает на вопросы в разрезе товаров: выручка по месяцам и категориям, возвраты по брендам.
      Инкрементальная модель, подробности в README.
    columns:
      - name: order_item_id
        description: "Ключ позиции вида 101-1: номер заказа и номер товара через дефис."
        data_tests: [unique, not_null]
      - name: order_id
        description: "Заказ. Ссылка на fct_orders."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_id
        description: "Товар. Ссылка на dim_products."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: customer_id
        description: "Клиент, оформивший заказ. Ссылка на dim_customers."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: "Дата заказа. Ссылка на dim_dates."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day
      - name: order_status
        description: "Статус заказа; нужен, например, чтобы считать возвраты по брендам."
        data_tests:
          - accepted_values:
              arguments:
                values: ['paid', 'pending', 'returned', 'cancelled']
      - name: quantity
        description: "Количество единиц товара."
        data_tests: [not_null, non_negative]
      - name: unit_price
        description: "Цена за единицу в рублях."
        data_tests: [not_null, non_negative]
      - name: gross_amount
        description: "Сумма позиции до скидки: количество × цена."
      - name: discount_amount
        description: "Скидка на позицию в рублях."
        data_tests: [not_null, non_negative]
      - name: line_amount
        description: "Сумма позиции после скидки."
        data_tests: [not_null, non_negative]
      - name: is_confirmed
        description: '{{ doc("confirmed_order") }}'
        data_tests: [not_null]

  - name: dim_customers
    description: >
      Измерение клиентов: одна строка — один клиент, включая тех, кто ничего не купил.
      Отвечает на вопросы про покупателей: доля по каналам привлечения, средний чек по городам.
    columns:
      - name: customer_id
        description: "Номер клиента, первичный ключ."
        data_tests: [unique, not_null]
      - name: registered_at
        description: "Время регистрации."
      - name: registration_date
        description: "Дата регистрации без времени."
      - name: city
        description: "Город клиента."
      - name: acquisition_channel
        description: "Канал привлечения: search, email, organic и другие."
      - name: first_confirmed_order_id
        description: "Номер первой подтверждённой покупки; пусто, если покупок нет. При одинаковом времени — меньший номер заказа."
      - name: first_confirmed_at
        description: "Время оформления первой подтверждённой покупки; пусто, если покупок нет."
      - name: confirmed_orders_count
        description: "Число подтверждённых покупок; 0, если их нет."
        data_tests: [not_null, non_negative]
      - name: confirmed_revenue
        description: "Сумма подтверждённых покупок по order_amount; 0, если их нет. Двойное списание сюда не попадает."
        data_tests: [not_null, non_negative]
      - name: is_buyer
        description: "Есть хотя бы одна подтверждённая покупка."
        data_tests: [not_null]

  - name: dim_products
    description: >
      Измерение товаров: одна строка — один товар со всей цепочкой категорий.
      Отвечает на вопросы в разрезе бренда и категории любого уровня.
    columns:
      - name: product_id
        description: "Номер товара, первичный ключ."
        data_tests: [unique, not_null]
      - name: product_name
        description: "Название товара."
      - name: brand
        description: "Бренд."
      - name: category_name
        description: "Категория, к которой относится товар."
        data_tests: [not_null]
      - name: parent_category_name
        description: "Родитель категории товара; пусто, если категория верхнего уровня."
      - name: root_category_name
        description: "Верхний уровень дерева: Electronics или Home."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Electronics', 'Home']
      - name: category_level
        description: "Уровень категории товара: 1 — верхний."
      - name: category_path
        description: "Полный путь категории, например Home > Kitchen > Cookware."

  - name: dim_dates
    description: >
      Календарь: одна строка — один день без пропусков, от первого до последнего заказа.
      Отвечает на вопросы по периодам: месяцы, кварталы, будни и выходные.
    columns:
      - name: date_day
        description: "Дата, первичный ключ."
        data_tests: [unique, not_null]
      - name: year_number
        description: "Год."
      - name: quarter_number
        description: "Квартал, от 1 до 4."
      - name: month_number
        description: "Месяц, от 1 до 12."
      - name: year_month
        description: "Год и месяц вида 2026-03: удобно группировать."
      - name: month_name
        description: "Название месяца."
      - name: day_of_month
        description: "Число месяца."
      - name: day_of_week
        description: "День недели: 1 — понедельник, 7 — воскресенье."
      - name: day_name
        description: "Название дня недели."
      - name: is_weekend
        description: "Суббота или воскресенье."
        data_tests: [not_null]
